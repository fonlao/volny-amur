server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 201.51.30.55 _;

    client_max_body_size 10M;
    server_tokens off;

    # Никогда не отдаём SPA на запросы к скрытым и служебным файлам.
    location ~ /\. { return 404; }
    location ~* \.(?:bak|backup|old|orig|save|swp|tmp|tfstate|ya?ml)$ { return 404; }

    location /assets/ {
        alias /opt/volny-amur/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /opt/volny-amur/staticfiles/;
        expires 7d;
    }

    location ^~ /admin/ {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/volny-amur/gunicorn.sock;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/volny-amur/gunicorn.sock;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        root /opt/volny-amur/dist;
        try_files $uri $uri/ /index.html;
    }
}
