<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Авторские путешествия по Хабаровскому краю: Шантарские острова, Сихотэ-Алинь и Амур." />
    <meta name="theme-color" content="#f4faf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#102c24" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const saved = localStorage.getItem('volny-amur-theme')
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : preferred
      })()
    </script>
    <title>Вольный Амур — путешествия по Хабаровскому краю</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
